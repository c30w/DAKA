name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 编译 SDK 的主版本号，必须和 app/build.gradle.kts 里的 compileSdk 保持一致。
      # 项目升 API 等级时，CI 只需要改这一个数字。
      ANDROID_COMPILE_SDK: "37"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        # 弃用 android-actions/setup-android@v3：该 action 仍会执行 `sdkmanager tools`，
        # 而 Google 早已移除旧 `tools` 包，在 cmdline-tools 16.0（新 runner）上直接失败
        # （Failed to find package 'tools'）。改为直接复用 runner 预装的 SDK 并补装编译部件。
        run: |
          set -eu
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDK_BIN="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -n1)"
          if [ -z "$SDK_BIN" ]; then
            echo "::error::runner 上找不到预装的 Android cmdline-tools"
            exit 1
          fi
          export PATH="$SDK_BIN:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # 收下所有 SDK 许可；AGP 的自动补包也依赖 licenses 文件。
          yes 2>/dev/null | sdkmanager --licenses > /dev/null
          # API 37 平台包带小版本号（android-37.0/37.1…），裸 platforms;android-37 不存在，挑最新稳定版。
          PLATFORM_PKG="$(
            sdkmanager --list 2>/dev/null \
              | tr -d '\r' \
              | grep -i "platforms;android-${ANDROID_COMPILE_SDK}" \
              | grep -viE 'beta|alpha|canary|-rc' \
              | grep -oE "platforms;android-${ANDROID_COMPILE_SDK}(\.[0-9]+)?" \
              | sort -uV \
              | tail -n 1 \
              || true
          )"
          if [ -z "$PLATFORM_PKG" ]; then
            echo "::error::SDK 远端清单里找不到 API ${ANDROID_COMPILE_SDK} 的稳定平台包"
            sdkmanager --list 2>/dev/null | grep -i 'platforms;android-' || true
            exit 1
          fi
          echo "安装平台包：$PLATFORM_PKG"
          sdkmanager --install "$PLATFORM_PKG" "platform-tools" "build-tools;36.0.0"
          echo "当前 SDK 里的平台：$(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        # 踩过的坑（2026-09-01，run #8）：
        # settings.gradle.kts 里阿里云镜像放在最前面，但 GitHub runner 在美国，
        # 访问阿里云镜像不稳定，导致 KSP 插件解析时 6 个仓库都失败（CI 里既连不上
        # 阿里云、又被镜像抢了顺序），报 "com.google.devtools.ksp not found"。
        # 本地能过是因为本地连阿里云正常。解法：CI 里用 DAKA_NO_MIRROR=true 关掉
        # 阿里云镜像，直接走官方源（google/mavenCentral），美国 runner 上反而更快更稳。
        env:
          DAKA_NO_MIRROR: "true"
        run: ./gradlew assembleDebug --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
