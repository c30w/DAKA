name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 编译 SDK 的主版本号，必须和 app/build.gradle.kts 里的 compileSdk 保持一致。
      # 项目升 API 等级时，CI 只需要改这一个数字。
      ANDROID_COMPILE_SDK: "37"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK platform
        # ⚠️ 踩过的坑（2026-09-01，run #2 起全红）：
        # Google 从 API 37 开始给平台包 id 加了小版本号，远端仓库里只有
        #   platforms;android-37.0 / platforms;android-37.1 / platforms;android-37.2 …
        # **不存在** 裸的 platforms;android-37。原来写死 `sdkmanager "platforms;android-37"`
        # 会让 sdkmanager 报 "Failed to find package" 并以退出码 1 结束——注意它挂在
        # **编译之前**，所以跟项目代码没关系，本地（Android Studio 装的正是
        # platforms/android-37.0）一直是好的。
        # 改为：先向 sdkmanager 要一次远端清单，再挑该主版本下最新的稳定包来装。
        run: |
          set -eu
          # 先收下所有 SDK 许可，否则装包会卡在交互确认上。
          # 顺便在 $ANDROID_HOME/licenses 留下许可文件——AGP 的自动补包也依赖它。
          yes 2>/dev/null | sdkmanager --licenses > /dev/null
          PLATFORM_PKG="$(
            sdkmanager --list 2>/dev/null \
              | tr -d '\r' \
              | grep -i "platforms;android-${ANDROID_COMPILE_SDK}" \
              | grep -viE 'beta|alpha|canary|-rc' \
              | grep -oE "platforms;android-${ANDROID_COMPILE_SDK}(\.[0-9]+)?" \
              | sort -uV \
              | tail -n 1 \
              || true
          )"
          if [ -z "$PLATFORM_PKG" ]; then
            echo "::error::SDK 远端清单里找不到 API ${ANDROID_COMPILE_SDK} 的稳定平台包"
            sdkmanager --list 2>/dev/null | grep -i 'platforms;android-' || true
            exit 1
          fi
          echo "安装平台包：$PLATFORM_PKG"
          sdkmanager --install "$PLATFORM_PKG"
          echo "当前 SDK 里的平台：$(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        # 踩过的坑（2026-09-01，run #8）：
        # settings.gradle.kts 里阿里云镜像放在最前面，但 GitHub runner 在美国，
        # 访问阿里云镜像不稳定，导致 KSP 插件解析时 6 个仓库都失败（CI 里既连不上
        # 阿里云、又被镜像抢了顺序），报 "com.google.devtools.ksp not found"。
        # 本地能过是因为本地连阿里云正常。解法：CI 里用 DAKA_NO_MIRROR=true 关掉
        # 阿里云镜像，直接走官方源（google/mavenCentral），美国 runner 上反而更快更稳。
        env:
          DAKA_NO_MIRROR: "true"
        run: ./gradlew assembleDebug --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
